services:
  bot:
    build: .
    container_name: moe-discord-bot
    ports:
      - "3067:3000"
    restart: always
    env_file:
      - .env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
